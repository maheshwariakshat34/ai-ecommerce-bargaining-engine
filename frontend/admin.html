<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller dashboard</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header>
    <b>Seller dashboard</b>
    <div class="row"><span id="who" class="muted"></span><a href="index.html">Store</a><button class="sec" id="out">Log out</button></div>
</header>

<main>
    <p class="muted" id="gate">Checking your login…</p>

    <div id="app" hidden>
        <div class="row" style="justify-content:space-between;margin-bottom:12px">
            <b id="count"></b><button id="add">+ Add product</button>
        </div>
        <p class="err" id="ge"></p>
        <div class="wrap">
            <table>
                <thead><tr><th>Name</th><th>Category</th><th>Base</th><th>Cost</th><th>Min</th><th>Stock</th><th>Expiry</th><th>Clearance price</th><th>Disc</th><th>Level</th><th></th></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal" id="modal">
    <div class="box">
        <b id="ft"></b>
        <div class="form" id="form"></div>
        <p class="err" id="fe"></p>
        <div class="row"><button id="save">Save</button><button class="sec" id="cancel">Cancel</button></div>
    </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const LOGIN = 'login.html?as=seller&next=admin.html';

const FIELDS = [
    ['name','Name','text'], ['category','Category','text'],
    ['base_price','Base price','number'], ['cost_price','Cost price','number'],
    ['minimum_price','Minimum price','number'], ['stock','Stock','number'],
    ['inventory_age','Inventory age (days)','number'], ['expiry_date','Expiry date (blank = none)','date'],
    ['sales_last_7_days','Sales last 7 days','number'], ['sales_last_30_days','Sales last 30 days','number'],
    ['demand_level','Demand','select'], ['seasonal_factor','Seasonal factor','number'],
    ['image_url','Photo link or images/file.jpg (optional)','text']
];
let list = [], editId = null;

async function api(url, method = 'GET', body) {
    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, j };
}

async function load() {
    // only a logged in seller may stay on this page
    const me = (await api('/api/auth/me')).j;
    if (!me.user || me.user.role !== 'admin') { location.replace(LOGIN); return; }
    $('#who').textContent = me.user.name;

    const r = await api('/api/products?view=admin');
    if (r.status === 401 || r.status === 403) { location.replace(LOGIN); return; }

    $('#gate').hidden = true; $('#app').hidden = false;
    list = r.j;
    const cl = await Promise.all(list.map(p => api('/api/clearance/' + p.id)));
    $('#count').textContent = list.length + ' products';
    $('#rows').innerHTML = list.map((p, i) => {
        const c = cl[i].j.clearance || {};
        const left = p.days_to_expiry;
        return `<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${inr(p.base_price)}</td><td>${inr(p.cost_price)}</td><td>${inr(p.minimum_price)}</td><td>${p.stock}</td>
        <td>${left == null ? '-' : left <= 0 ? 'expired' : left + ' d'}</td>
        <td>${c.clearance_price != null ? inr(c.clearance_price) : '-'}</td><td>${c.discount_percent ?? '-'}%</td>
        <td><span class="badge ${esc(c.clearance_level)}" title="${esc((c.reasons || []).join(', '))}">${esc(c.clearance_level || '-')}</span></td>
        <td><button class="sec" data-e="${p.id}">Edit</button> <button class="del" data-d="${p.id}">Delete</button></td></tr>`;
    }).join('');
}

function openForm(p) {
    editId = p ? p.id : null;
    $('#ft').textContent = p ? 'Edit product' : 'Add product';
    $('#fe').textContent = '';
    $('#form').innerHTML = FIELDS.map(([k, l, t]) => `<div><label>${l}</label>` + (t === 'select'
        ? `<select id="f_${k}">${['LOW', 'MEDIUM', 'HIGH'].map(v => `<option ${(p?.[k] || 'MEDIUM') === v ? 'selected' : ''}>${v}</option>`).join('')}</select>`
        : `<input id="f_${k}" type="${t}" step="any" value="${esc(p ? p[k] : (t === 'number' ? 0 : ''))}">`) + '</div>').join('');
    $('#modal').classList.add('open');
}

$('#add').onclick = () => openForm(null);
$('#cancel').onclick = () => $('#modal').classList.remove('open');
$('#out').onclick = async () => { await api('/api/auth/logout', 'POST', {}); location.assign('login.html'); };

$('#rows').onclick = async e => {
    const d = e.target.dataset;
    if (d.e) openForm(list.find(p => p.id == d.e));
    if (d.d && confirm('Delete this product?')) {
        const r = await api('/api/products/' + d.d, 'DELETE');
        $('#ge').textContent = r.ok ? '' : (r.j.message || r.j.error || 'Delete failed');
        load();
    }
};

$('#save').onclick = async () => {
    const b = {};
    for (const [k, , t] of FIELDS) {
        const v = $('#f_' + k).value.trim();
        b[k] = t === 'number' ? (v === '' ? null : Number(v)) : v;
    }
    const r = editId ? await api('/api/products/' + editId, 'PUT', b) : await api('/api/products', 'POST', b);
    if (!r.ok) { $('#fe').textContent = r.j.message || r.j.error || 'Could not save.'; return; }
    $('#modal').classList.remove('open');
    load();
};

load();
</script>
</body>
</html>
